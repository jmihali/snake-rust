[package]
name = "snake-tmp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "display"] }
macroquad = { version = "0.4.14", optional = true}
rand = "0.10.1"
raylib = { version = "5.5.1", optional = true }
tokio = { version = "1.52.3", features = ["rt", "macros"], optional = true }

[features]
default = ["macroquad_support"]
macroquad_support = ["dep:macroquad"]
raylib_support = ["dep:raylib", "dep:tokio"]
